schema: spec-driven
context: |
  Project: parking management web application for operators and administrators.
  Active architecture: Python 3 with Flask as the local web application and
  gateway; Xano is the sole backend, database, and business-rules platform.
  The browser UI uses semantic HTML, Tailwind CSS, and JavaScript with async
  fetch requests to Flask routes, which proxy JSON requests to Xano over HTTPS.
  Do not add a local database, ORM, Node.js server, or duplicate business rules.
  Source identifiers, JSON keys, and API routes use English; operator UI and
  messages use Portuguese (pt-PT).
  XANO_BASE_URL and any Xano API key are supplied only through environment
  variables loaded from .env; never commit credentials or embed defaults.
  Core Xano resources are tariffs, vehicles, parking_records, and
  parking_capacity. Xano owns capacity validation, pricing, state transitions,
  and payment confirmation.
rules:
  proposal:
    - Keep each change small, incremental, and verifiable.
    - State scope, affected surfaces, dependencies, and acceptance criteria.
    - Do not assume unresolved domain or integration decisions.
  specs:
    - Keep requirements aligned with docs/domain-model.md and docs/specs/xano-backend.md.
    - Specify observable behavior and JSON contracts; keep business rules in Xano.
  design:
    - Preserve Flask as the only active application runtime and Xano as the only persistence layer.
    - Prefer vertical delivery across API proxy, UI, and verification.
  tasks:
    - Break implementation into independently verifiable tasks.
    - Include focused tests and relevant documentation updates.
